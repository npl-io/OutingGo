services:
  db:
    image: postgres:16
    container_name: outinggo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: outinggo
      POSTGRES_PASSWORD: outinggo
      POSTGRES_DB: outinggo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outinggo -d outinggo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: